<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>رادار بايننس — 7 طبقات</title>
  <meta name="theme-color" content="#070b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>رادار بايننس</h1>
          <p class="tagline">7 طبقات تأكيد · حيتان · فرص دخول</p>
        </div>
        <button type="button" id="btn-settings" class="icon-btn" aria-label="إعدادات">⚙</button>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="radar">الفرص</button>
        <button type="button" class="tab" data-tab="whales">الحيتان</button>
        <button type="button" class="tab" data-tab="layers">الطبقات</button>
        <button type="button" class="tab" data-tab="exit">الخروج</button>
      </nav>
    </header>

    <section class="control-bar">
      <div class="status" id="status">اضغط مسح لبدء التحليل</div>
      <div class="ctrl-btns">
        <button type="button" id="btn-scan" class="btn primary">مسح السوق</button>
        <button type="button" id="btn-stop" class="btn ghost" hidden>إيقاف</button>
      </div>
    </section>

    <section class="filters-row">
      <label>
        <span>السيولة</span>
        <select id="min-vol">
          <option value="3000000">3M+</option>
          <option value="5000000" selected>5M+</option>
          <option value="10000000">10M+</option>
          <option value="20000000">20M+</option>
        </select>
      </label>
      <label>
        <span>الحد الأدنى</span>
        <select id="min-layers">
          <option value="4">4/7+</option>
          <option value="5" selected>5/7+</option>
          <option value="6">6/7+</option>
          <option value="7">7/7 فقط</option>
        </select>
      </label>
      <label>
        <span>نتائج</span>
        <select id="max-n">
          <option value="25">25</option>
          <option value="40" selected>40</option>
          <option value="60">60</option>
        </select>
      </label>
    </section>

    <div class="progress" id="progress" hidden>
      <div class="bar"><div class="fill" id="pfill"></div></div>
      <span id="ptext">0%</span>
    </div>
    <div class="err" id="err" hidden></div>

    <main id="panel-radar" class="panel active"></main>
    <main id="panel-whales" class="panel" hidden></main>
    <main id="panel-layers" class="panel" hidden></main>
    <main id="panel-exit" class="panel" hidden></main>

    <footer class="foot">تعليميم فقط · بيانات Binance العامة · GitHub Pages</footer>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="sheet" id="sheet" hidden>
    <div class="sheet-h">
      <h2>الإعدادات</h2>
      <button type="button" id="btn-close" class="icon-btn">✕</button>
    </div>
    <p class="muted">عتبات الطبقات السبع حسب نظام التأكيد المتعدد (Trend · Momentum · Volume · Squeeze · Structure · Smart Money · MTF).</p>
    <label class="field"><span>حد صفقة الحوت (USDT)</span>
      <input type="number" id="whale-min" value="25000" min="5000" step="1000">
    </label>
    <label class="field check">
      <input type="checkbox" id="ex-majors" checked>
      <span>استبعاد BTC / ETH من قوائم الفرص</span>
    </label>
    <label class="field check">
      <input type="checkbox" id="long-only" checked>
      <span>الفرص: اتجاه شراء فقط (Long)</span>
    </label>
    <button type="button" id="btn-save" class="btn primary full">حفظ</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
